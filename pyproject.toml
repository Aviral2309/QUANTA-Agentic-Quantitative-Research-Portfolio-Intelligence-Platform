[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta-research"
version = "0.3.0"
description = "QUANTA: deterministic quantitative research + portfolio construction + agentic research harness"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "QUANTA Project Team"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "statsmodels>=0.14,<1",
  "yfinance>=0.2.54,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "matplotlib>=3.8,<4",
  "langgraph>=0.2,<2",
  "langchain-core>=0.3,<2",
]

[project.optional-dependencies]
llm = ["langchain-openai>=0.2,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
quanta = "quanta.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
